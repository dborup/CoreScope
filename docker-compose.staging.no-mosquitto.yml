# docker-compose.staging.no-mosquitto.yml — legacy staging override.
#
# AUDIENCE: kept for historical parity with pre-v3.7 staging shape and
# for local reproduction of "staging without an external broker". In
# most cases you want `docker-compose.staging.yml` instead — it is the
# CoreScope maintainers' actual staging deploy shape, and it already
# defaults `DISABLE_MOSQUITTO=true` (external broker on `meshcore-net`).
#
# Use this file ONLY if you are explicitly reproducing the legacy
# in-container-mosquitto staging shape (e.g. debugging a broker
# regression). Third-party single-host deploys should use
# `docker-compose.example.yml` (or `docker-compose.no-mosquitto.yml`
# for a prod-flavoured variant with an external broker).

services:
  staging-go:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: corescope-go:latest
    container_name: corescope-staging-go
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    deploy:
      resources:
        limits:
          memory: 3g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${STAGING_GO_HTTP_PORT:-82}:80"
      # PPROF_BIND is the host interface the pprof ports are published on,
      # 127.0.0.1 unless set (#441); reach them with an SSH tunnel or set
      # PPROF_BIND=0.0.0.0 for remote access. See docker-compose.staging.yml.
      - "${PPROF_BIND:-127.0.0.1}:6060:6060"
      - "${PPROF_BIND:-127.0.0.1}:6061:6061"
    volumes:
      - ${STAGING_DATA_DIR:-~/meshcore-staging-data}:/app/data
      - caddy-data-staging-go:/data/caddy
    environment:
      - NODE_ENV=staging
      - ENABLE_PPROF=true
      # Every interface INSIDE the container, so the published pprof ports
      # above reach it; PPROF_BIND decides who on the host can (#441).
      - PPROF_HOST=0.0.0.0
      - DISABLE_MOSQUITTO=true
      # In-process settings — read by the server and the ingestor, not by
      # docker compose. Without these lines a value in .env reaches docker
      # compose and stops there, so the documented "one line in .env" would
      # change nothing in the container (#372). Every one defaults to EMPTY,
      # which every reader ignores: pprofbind skips a blank host or port,
      # LoadConfig skips a blank MQTT_BROKER, and MQTT_SOURCE_STRICT is
      # false unless truthy. An install that never set them is unaffected.
      - MQTT_BROKER=${MQTT_BROKER:-}
      - MQTT_TOPIC=${MQTT_TOPIC:-}
      - MQTT_SOURCE_STRICT=${MQTT_SOURCE_STRICT:-}
      - PPROF_HOST_SERVER=${PPROF_HOST_SERVER:-}
      - PPROF_HOST_INGESTOR=${PPROF_HOST_INGESTOR:-}
      - PPROF_PORT=${PPROF_PORT:-}
      - PPROF_PORT_SERVER=${PPROF_PORT_SERVER:-}
      - PPROF_PORT_INGESTOR=${PPROF_PORT_INGESTOR:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  caddy-data-staging-go:
