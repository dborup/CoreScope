name: Info site tests

# The standalone info pages in sites/meshview-info/ (served as /velkommen,
# /observer, /hardware, /radio, /guider, /faq) have their own browser tests.
# deploy.yml does not run them, so this workflow runs every
# sites/meshview-info/test-*.cjs|js on changes to the info site.
# Read-only: no secrets, no publish, no deploy.

on:
  pull_request:
    paths:
      - 'sites/meshview-info/**'
      - 'scripts/run-info-site-tests.sh'
      - '.github/workflows/info-site.yml'
  push:
    branches: [master]
    paths:
      - 'sites/meshview-info/**'
      - 'scripts/run-info-site-tests.sh'
      - '.github/workflows/info-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: info-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  info-site:
    name: "🌐 Info site tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --production=false

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run info site tests
        run: bash scripts/run-info-site-tests.sh
