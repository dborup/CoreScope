# Mosquitto config for MeshCore Analyzer
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /var/lib/mosquitto/

# Mosquitto >= 2.1 defaults allow_duplicate_messages to true: a client with
# overlapping subscriptions (the ingestor's meshcore/+/+/packets + meshcore/#)
# then receives every message once per matching subscription. Keep one
# delivery per client. Deprecated upstream (removal planned for Mosquitto 3.0);
# the broker logs a deprecation warning at startup.
allow_duplicate_messages false

# Logging
log_dest stdout
log_type warning
log_type error
